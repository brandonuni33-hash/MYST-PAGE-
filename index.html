lor:#ff8520;font-weight:1000;text-shadow:0 0 25px #ff650044}.heading{font-size:clamp(29px,8vw,38px);line-height:1.04;letter-spacing:-.045em;margin:26px 0 10px;font-weight:950}.description{font-size:15px;line-height:1.6;color:#b5aca6;max-width:285px;margin:0 0 33px}.link{width:100%;min-height:62px;display:flex;align-items:center;justify-content:center;border-radius:16px;text-decoration:none;font-weight:900;font-size:13px;letter-spacing:.055em;transition:transform .2s,background .2s}.link:active{transform:scale(.97)}.primary{background:linear-gradient(115deg,#ffb34e,#ff7815 70%,#ee5400);color:#140900;box-shadow:0 10px 36px #ff640025}.secondary{border:1px solid #504039;background:#171311;color:white;margin-top:13px}.link[aria-disabled=true]{opacity:.55;cursor:not-allowed}.foot{margin-top:40px;font-size:10px;letter-spacing:.27em;color:#77675f;font-weight:800}.back{border:0;background:none;color:#9b8a80;margin-top:27px;padding:12px;cursor:pointer;font-size:12px}.reduced .drop-shape{animation:none;opacity:0}.reduced .question-shape{animation:none;opacity:1}.reduced .hint{animation:none;opacity:1;transform:none}@keyframes fall{0%{transform:translateY(-330px) scale(.56,1.22);opacity:0}35%{opacity:1}70%{transform:translateY(8px) scale(.88,1.12)}86%{transform:translateY(-8px) scale(1.08,.93)}100%{transform:translateY(0) scale(1);opacity:0}}@keyframes appear{0%{opacity:0;transform:scale(.78,1.14);filter:blur(5px)}100%{opacity:1;transform:scale(1);filter:blur(0)}}@keyframes hide{to{opacity:0}}@keyframes breathe{50%{filter:drop-shadow(0 0 36px #ff780075);transform:scale(1.035)}}@keyframes hint{to{opacity:1;transform:translateY(0)}}@keyframes reveal{to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-delay:0ms!important;transition-duration:.01ms!important}.drop-shape{opacity:0!important}.question-shape,.hint{opacity:1!important}}

// Remplacer ces deux valeurs par les liens officiels validés avant publication.
const LINKS={review:"",tiktok:""};
const intro=document.getElementById("intro"),mark=document.getElementById("mark"),reveal=document.getElementById("reveal");
const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;
if(reduced)document.body.classList.add("reduced");
setTimeout(()=>{mark.disabled=false;mark.classList.add("ready")},reduced?0:2050);
mark.addEventListener("click",()=>{if(mark.disabled)return;mark.disabled=true;intro.classList.add("exit");setTimeout(()=>{intro.style.display="none";reveal.classList.add("visible");reveal.setAttribute("aria-hidden","false");document.getElementById("review").focus()},reduced?0:400)});
for(const [key,url] of Object.entries(LINKS)){const el=document.getElementById(key);if(/^https:\/\//i.test(url)){el.href=url;el.removeAttribute("aria-disabled");el.target="_blank";el.rel="noopener noreferrer"}else{el.addEventListener("click",e=>e.preventDefault());el.title="Lien à configurer"}}

</script></body></html>
